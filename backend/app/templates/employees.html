<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employees</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f7f9fc; }
        section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        a { color: #2c3e50; text-decoration: none; }
    </style>
</head>
<body>
    <header style="margin-bottom: 30px; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);">
        <nav style="display: flex; gap: 24px; align-items: center;">
            <a href="/" style="font-weight: 700; color: #2c3e50;">Home</a>
            <a href="/departments" style="color: #2c3e50;">Departments</a>
            <a href="/employees" style="color: #2c3e50;">Employees</a>
            <a href="/records" style="color: #2c3e50;">Records</a>
        </nav>
    </header>
    <section>
        <h1>Employees</h1>
        <form id="employee-form">
            <label>First Name<br><input type="text" name="first_name" required></label><br><br>
            <label>Last Name<br><input type="text" name="last_name" required></label><br><br>
            <label>Email<br><input type="email" name="email"></label><br><br>
            <label>Department<br>
                <select name="department_id">
                    <option value="">General</option>
                    {% for department in departments %}
                    <option value="{{ department.id }}">{{ department.name }}</option>
                    {% endfor %}
                </select>
            </label><br><br>
            <button type="submit">Create employee</button>
            <span id="employee-message" style="margin-left: 1rem;color:#2c3e50"></span>
        </form>

        <h2>Existing employees</h2>
        <ul id="employee-list">
            {% for employee in employees %}
            <li>{{ employee.id }} — {{ employee.first_name }} {{ employee.last_name }} (dept {{ employee.department_id }})</li>
            {% else %}
            <li>No employees yet.</li>
            {% endfor %}
        </ul>
    </section>

    <script>
        const employeeForm = document.getElementById('employee-form');
        const employeeList = document.getElementById('employee-list');
        employeeForm.addEventListener('submit', async event => {
            event.preventDefault();
            const message = document.getElementById('employee-message');
            message.textContent = '';
            const formData = new FormData(employeeForm);
            const payload = {
                first_name: formData.get('first_name')?.toString().trim(),
                last_name: formData.get('last_name')?.toString().trim(),
                email: formData.get('email')?.toString().trim() || undefined,
                department_id: formData.get('department_id') ? Number(formData.get('department_id')) : undefined,
            };

            try {
                const response = await fetch('/employees', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || 'Request failed');
                }
                const employee = await response.json();
                const item = document.createElement('li');
                item.textContent = `${employee.id} — ${employee.first_name} ${employee.last_name} (dept ${employee.department_id})`;
                employeeList.appendChild(item);
                message.textContent = 'Employee created.';
                employeeForm.reset();
            } catch (error) {
                message.textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
