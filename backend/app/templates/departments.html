<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Departments</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f7f9fc; }
        section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        a { color: #2c3e50; text-decoration: none; }
    </style>
</head>
<body>
    <header style="margin-bottom: 30px; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);">
        <nav style="display: flex; gap: 24px; align-items: center;">
            <a href="/" style="font-weight: 700; color: #2c3e50;">Home</a>
            <a href="/departments" style="color: #2c3e50;">Departments</a>
            <a href="/employees" style="color: #2c3e50;">Employees</a>
            <a href="/records" style="color: #2c3e50;">Records</a>
        </nav>
    </header>
    <section>
        <h1>Departments</h1>
        <form id="department-form">
            <label>Name<br><input type="text" name="name" required></label><br><br>
            <button type="submit">Create department</button>
            <span id="department-message" style="margin-left: 1rem;color:#2c3e50"></span>
        </form>

        <h2>Existing departments</h2>
        <ul id="department-list">
            {% for department in departments %}
            <li>{{ department.id }} — {{ department.name }}</li>
            {% else %}
            <li>No departments yet.</li>
            {% endfor %}
        </ul>
    </section>

    <script>
        const departmentForm = document.getElementById('department-form');
        const departmentList = document.getElementById('department-list');
        departmentForm.addEventListener('submit', async event => {
            event.preventDefault();
            const message = document.getElementById('department-message');
            message.textContent = '';
            const formData = new FormData(departmentForm);
            const payload = { name: formData.get('name')?.toString().trim() };

            try {
                const response = await fetch('/departments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || 'Request failed');
                }
                const department = await response.json();
                const item = document.createElement('li');
                item.textContent = `${department.id} — ${department.name}`;
                departmentList.appendChild(item);
                message.textContent = 'Department created.';
                departmentForm.reset();
            } catch (error) {
                message.textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
