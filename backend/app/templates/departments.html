<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Departments</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="header">
        <img class="logo" src="/static/PyLadies_Prishtina_Logo.jpeg" alt="Logo">
            <nav class="navbar">
                <a href="/" class="navbar_element">HOME</a>
                <a href="/departments" class="navbar_element">DEPARTMENTS</a>
                <a href="/employees" class="navbar_element">EMPLOYEES</a>
                <a href="/records"  class="navbar_element">RECORDS</a>
                <a href="/predictions"  class="navbar_element">PREDICTIONS</a>
            </nav>        
        <img class="logo" src="/static/PyLadies_Prishtina_Logo.jpeg" alt="Logo">
    </header>
    <main class="main">
        <h1 class="pageTitle">DEPARTMENTS</h1>
        <form id="department-form">
            <input type="text" name="name" placeholder="Name" required>
            <button type="submit" class="button">Create department</button>
            <span id="department-message" style="margin-left: 1rem;color:#2c3e50"></span>
        </form>

        <h2 class="long-paragraph">EXISTING DEPARTMENTS</h2>
        <ul id="department-list">
            {% for department in departments %}
            <li>{{ department.id }} — {{ department.name }}</li>
            {% else %}
            <li>No departments yet</li>
            {% endfor %}
        </ul>
    </main>
    <footer class="footer">
        <p>© PyLadies Prishtina 2026</p>
    </footer>
    
    <script>
        const departmentForm = document.getElementById('department-form');
        const departmentList = document.getElementById('department-list');
        departmentForm.addEventListener('submit', async event => {
            event.preventDefault();
            const message = document.getElementById('department-message');
            message.textContent = '';
            const formData = new FormData(departmentForm);
            const payload = { name: formData.get('name')?.toString().trim() };

            try {
                const response = await fetch('/departments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || 'Request failed');
                }
                const department = await response.json();
                const item = document.createElement('li');
                item.textContent = `${department.id} — ${department.name}`;
                departmentList.appendChild(item);
                message.textContent = 'Department created.';
                departmentForm.reset();
            } catch (error) {
                message.textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
